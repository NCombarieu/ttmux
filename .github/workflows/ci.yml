name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools make tmux

      - name: Build RPM
        run: make rpm
