name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux and shellcheck
        run: |
          # tmux et shellcheck sont déjà sur l'image du runner ; on ne passe
          # par apt qu'en secours, car « apt-get update » y casse
          # régulièrement sur des dépôts tiers (Chrome…) sans rapport.
          if ! command -v tmux >/dev/null || ! command -v shellcheck >/dev/null; then
            sudo apt-get update || true
            sudo apt-get install -y tmux shellcheck
          fi
          tmux -V
          shellcheck --version | sed -n '2p'

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools make tmux

      - name: Build RPM
        run: make rpm
