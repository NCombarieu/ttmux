name: Update RPM repository

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install createrepo_c
        run: sudo apt-get install -y createrepo-c

      - name: Download RPM from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "*.rpm" \
            --dir repo

      - name: Rebuild repo metadata
        run: createrepo_c --update repo

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git diff --cached --quiet || git commit -m "repo: add ${{ github.event.release.tag_name }}"
          git push
